<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Robotron: 2084</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/5.3.10/pixi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        html, body { 
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000; 
            overflow: hidden; 
        }
        body {
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Centering handled by JS in resizeGame for robustness */
        }
        #game-container {
            border: 2px solid #fff;
            box-shadow: 0 0 20px #0ff, 0 0 30px #0ff;
            /* width and height will be set by JS */
        }
        canvas {
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui-container {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            padding: 5px 0;
            color: #FFFF00;
            margin-top: 5px;
            visibility: hidden; /* Hidden by default, shown during PLAYING */
            /* width will be set by JS */
        }
        #score, #lives, #bonus { 
            padding: 0 5px;
        }
        #message-box { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            color: #FFFF00;
            padding: 20px;
            border: 2px solid #FFFF00;
            text-align: center;
            font-size: 12px;
            z-index: 100;
            display: none;
            max-width: 90%;
        }
        #message-title {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .button { 
            font-family: 'Press Start 2P', cursive;
            background-color: #FF00FF;
            color: #FFFFFF;
            border: 2px solid #FFFFFF;
            padding: 10px 15px;
            font-size: 0.8em;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px #AA00AA;
            transition: background-color 0.1s, box-shadow 0.1s, transform 0.1s;
            margin-top: 10px;
        }
        .button:hover {
            background-color: #DD00DD;
            box-shadow: 1px 1px 0px #AA00AA;
            transform: translate(2px, 2px);
        }
        .button:active {
            background-color: #BB00BB;
            box-shadow: 0px 0px 0px #AA00AA;
            transform: translate(3px, 3px);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            </div>
        <div id="ui-container">
            <div id="score">SCORE: 0</div>
            <div id="bonus">BONUS: 1000</div> 
            <div id="lives">LIVES: 30</div>
        </div>
    </div>
    <div id="message-box"> 
        <div id="message-title">GAME OVER</div>
        <div id="message-text">FINAL SCORE: 0</div>
        <button id="play-again-button" class="button">PLAY AGAIN?</button>
    </div>

    <script>
        // Robotron: 2084 - v1.28 (Enhanced Attract Mode)
        // Author: Steve Hatch (steve@hatch.org) + AI

        // Sound Manager
        const SoundManager = {
            sounds: {},
            // Don't play sounds during demo mode
            canPlaySound() {
                return gameState !== 'DEMO_PLAY';
            },
            init() {
                // Player sounds
                this.sounds.shoot = new Howl({
                    src: ['sounds/shoot.wav'],
                    volume: 0.5
                });
                this.sounds.playerDeath = new Howl({
                    src: ['sounds/player_death.wav'],
                    volume: 0.7
                });

                // Enemy sounds
                this.sounds.gruntPop = new Howl({
                    src: ['sounds/grunt_pop.wav'],
                    volume: 0.6
                });
                this.sounds.spheroidPop = new Howl({
                    src: ['sounds/spheroid_pop.wav'],
                    volume: 0.6
                });
                this.sounds.enforcerPop = new Howl({
                    src: ['sounds/enforcer_pop.wav'],
                    volume: 0.6
                });
                this.sounds.enforcerFire = new Howl({
                    src: ['sounds/enforcer_fire.wav'],
                    volume: 0.5
                });
                this.sounds.brainPop = new Howl({
                    src: ['sounds/brain_pop.wav'],
                    volume: 0.6
                });
                this.sounds.brainFire = new Howl({
                    src: ['sounds/brain_fire.wav'],
                    volume: 0.5
                });
                this.sounds.tankPop = new Howl({
                    src: ['sounds/tank_pop.wav'],
                    volume: 0.6
                });
                this.sounds.tankFire = new Howl({
                    src: ['sounds/tank_fire.wav'],
                    volume: 0.5
                });
                this.sounds.shellBounce = new Howl({
                    src: ['sounds/shell_bounce.wav'],
                    volume: 0.4
                });
                this.sounds.progDestroy = new Howl({
                    src: ['sounds/prog_destroy.wav'],
                    volume: 0.6
                });
                this.sounds.quarkPop = new Howl({
                    src: ['sounds/quark_pop.wav'],
                    volume: 0.6
                });
                this.sounds.subQuarkPop = new Howl({
                    src: ['sounds/sub_quark_pop.wav'],
                    volume: 0.5
                });

                // Human sounds
                this.sounds.humanRescue = new Howl({
                    src: ['sounds/human_rescue.wav'],
                    volume: 0.7
                });
                this.sounds.humanDeathByEnemy = new Howl({
                    src: ['sounds/human_death.wav'],
                    volume: 0.7
                });
                this.sounds.humanToProg = new Howl({
                    src: ['sounds/human_to_prog.wav'],
                    volume: 0.6
                });

                // Game event sounds
                this.sounds.waveStart = new Howl({
                    src: ['sounds/wave_start.wav'],
                    volume: 0.7
                });
                this.sounds.gameOver = new Howl({
                    src: ['sounds/game_over.wav'],
                    volume: 0.8
                });
                this.sounds.extraLife = new Howl({
                    src: ['sounds/extra_life.wav'],
                    volume: 0.7
                });
                this.sounds.insertCoin = new Howl({
                    src: ['sounds/insert_coin.wav'],
                    volume: 0.7
                });
            },
            play(soundName) {
                if (this.sounds[soundName] && this.canPlaySound()) {
                    try {
                        this.sounds[soundName].play();
                    } catch(e) {
                        console.warn(`Sound play failed (${soundName}):`, e);
                    }
                }
            },
            stop(soundName) {
                if (this.sounds[soundName]) {
                    try {
                        this.sounds[soundName].stop();
                    } catch(e) {
                        console.warn(`Sound stop failed (${soundName}):`, e);
                    }
                }
            },
            stopAll() {
                Object.values(this.sounds).forEach(sound => {
                    try {
                        sound.stop();
                    } catch(e) {
                        console.warn('Sound stop failed:', e);
                    }
                });
            }
        };

        // Initialize audio context on user interaction
        function initAudio() {
            if (typeof Howler !== 'undefined' && Howler.ctx && Howler.ctx.state === 'suspended') {
                Howler.ctx.resume().then(() => {
                    console.log('AudioContext resumed successfully');
                    // Initialize sound manager after audio context is resumed
                    SoundManager.init();
                });
            } else if (typeof Howler !== 'undefined') {
                // Initialize sound manager if audio context is already active
                SoundManager.init();
            }
        }

        // Add click and keydown listeners to initialize audio
        document.addEventListener('click', initAudio);
        document.addEventListener('keydown', initAudio);

        // Game constants
        const GAME_WIDTH = 292;
        const GAME_HEIGHT = 240;
        const PLAYER_SPEED = 2;
        const PROJECTILE_SPEED = 4;
        const ENFORCER_PROJECTILE_SPEED = 2.5;
        const BRAIN_PROJECTILE_SPEED = 2;
        const TANK_SHELL_SPEED = 1.8;
        
        // Attract mode timing constants
        const TITLE_SCREEN_DURATION = 300;
        const HIGH_SCORE_DURATION = 180;
        const DEMO_PLAY_DURATION = 450;
        
        // Enemy speeds
        const GRUNT_SPEED = 0.6;
        const GRUNT_ACCELERATION = 0.03;
        const GRUNT_MAX_SPEED = 1.0;
        const GRUNT_TURN_RATE = 0.08;
        const HULK_SPEED = 0.3;
        const HULK_CHARGE_SPEED = 1.2;
        const ENFORCER_SPEED = 0.8;
        const BRAIN_SPEED = 0.6;
        const TANK_SPEED = 0.4;
        const SPHEROID_SPEED = 0.7;
        const QUARK_SPEED = 1.2;
        const SUB_QUARK_SPEED = 1.5;
        const PROG_SPEED = 1.3;
        const HUMAN_SPEED = 0.3;
        
        // Enemy timings
        const ENFORCER_SHOOT_DELAY = 120;
        const BRAIN_SHOOT_DELAY = 150;
        const TANK_SHOOT_DELAY = 180;
        const BRAIN_REPROGRAM_RANGE = 20;
        const BRAIN_REPROGRAM_DURATION = 120;
        const SPHEROID_SPAWN_ENFORCER_DELAY = 300;
        const QUARK_SPAWN_SUB_QUARK_DELAY = 180;
        
        // Game mechanics
        const INITIAL_LIVES = 30;
        const MAX_PLAYER_PROJECTILES = 10;
        const RESPAWN_INVULNERABILITY_TIME = 2000;
        const INITIAL_HUMAN_RESCUE_BONUS = 1000;
        const MAX_HUMAN_RESCUE_BONUS = 5000;
        const HUMAN_RESCUE_BONUS_INCREMENT = 1000;
        const HUMAN_RESCUE_BONUS_DECAY_DURATION = 300;
        const TANK_SHELL_BOUNCES = 2;
        const MAX_SUB_QUARKS_PER_QUARK = 3;
        const ELECTRODE_FLASH_RATE = 0.1;
        const EXTRA_LIFE_SCORE_INTERVAL = 25000;
        const INSERT_COIN_FLASH_INTERVAL = 30;
        const ATTRACT_MODE_CYCLE_TIME = 400; // Simplified for now, just title screen
        const GAMEPAD_DEADZONE = 0.2; // Minimum analog stick value to register movement
        const PLAYER_SHOOT_RATE = 100; // 166 is ~6 shots per second
        // Standard gamepad button indices
        const GAMEPAD_START_BUTTON_INDEX = 9; // Start button
        const GAMEPAD_SELECT_BUTTON_INDEX = 8; // Select/Back button
        const GAMEPAD_A_BUTTON_INDEX = 0; // A/Cross button
        // Demo play duration is defined in game constants section
        
        // Game state
        let gameState = 'TITLE_SCREEN'; 
        let score = 0;
        let lives = INITIAL_LIVES; 
        let wave = 0;
        let playerInvulnerableTime = 0;
        let currentHumanRescueBonus = INITIAL_HUMAN_RESCUE_BONUS;
        let humanRescueBonusDecayTimer = 0; 
        let nextExtraLifeScore = EXTRA_LIFE_SCORE_INTERVAL;
        let insertCoinFlashTimer = 0;
        let highScore = 0; 
        let attractModeTimer = ATTRACT_MODE_CYCLE_TIME; 
        let player = null; 
        let demoPlayer = null;
        let gamepads = [];
        let lastGamepadTimestamp = 0;
        let gamepadMovementX = 0;
        let gamepadMovementY = 0;
        let gamepadShootingX = 0;
        let gamepadShootingY = 0;
        let playerProjectiles = [];
        let enemyProjectiles = [];
        let enemies = [];
        let humans = [];
        let obstacles = [];
        let effects = [];
        let baseUiHeight = 40; // Height of the UI area

        // PixiJS app setup
        const app = new PIXI.Application({ width: GAME_WIDTH, height: GAME_HEIGHT, backgroundColor: 0x000000, antialias: false, }); 
        document.getElementById('game-container').appendChild(app.view); 
        PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.NEAREST;

        // Game containers
        const titleScreenContainer = new PIXI.Container(); 
        const highScoreDisplayContainer = new PIXI.Container();
        const demoPlayContainer = new PIXI.Container();
        const playerContainer = new PIXI.Container(); 
        const playerProjectilesContainer = new PIXI.Container(); 
        const enemyProjectilesContainer = new PIXI.Container(); 
        const enemiesContainer = new PIXI.Container(); 
        const humansContainer = new PIXI.Container(); 
        const obstaclesContainer = new PIXI.Container(); 
        const effectsContainer = new PIXI.Container();
        
        app.stage.addChild(titleScreenContainer); 
        app.stage.addChild(highScoreDisplayContainer);
        app.stage.addChild(humansContainer); 
        app.stage.addChild(obstaclesContainer); 
        app.stage.addChild(enemiesContainer); 
        app.stage.addChild(playerProjectilesContainer); 
        app.stage.addChild(enemyProjectilesContainer); 
        app.stage.addChild(playerContainer); 
        app.stage.addChild(effectsContainer);

        // UI Elements (HTML)
        const scoreTextEl = document.getElementById('score');
        
        function updateScoreDisplay() {
            if (scoreTextEl) {
                scoreTextEl.textContent = `SCORE: ${score}`;
            }
        }
        
        function updateBonusDisplay() {
            if (bonusTextEl) {
                bonusTextEl.textContent = `BONUS: ${currentHumanRescueBonus}`;
            }
        }
        const livesTextEl = document.getElementById('lives'); 
        const bonusTextEl = document.getElementById('bonus'); 
        const uiContainerEl = document.getElementById('ui-container'); 
        const messageBoxEl = document.getElementById('message-box'); 
        const messageTitleEl = document.getElementById('message-title'); 
        const messageTextEl = document.getElementById('message-text'); 
        const playAgainButtonEl = document.getElementById('play-again-button');

        // Title Screen PIXI.Text Elements
        let titleText, williamsText, insertCoinText, pressStartText, highScoreTextElement; 

        // Initial resize to set correct scale
        resizeGame();

        // Sound setup
        const sounds = { shoot: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('123')],volume:0.15}), playerDeath: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('321')],volume:0.4}), enemyDestroy: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('456')],volume:0.25}), spheroidPop: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('ABC')],volume:0.3}), enforcerFire: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('DEF')],volume:0.2}), brainFire: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('GHI')],volume:0.25}), brainDestroy: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('JKL')],volume:0.3}), tankFire: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('MNO')],volume:0.35}), tankDestroy: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('PQR')],volume:0.4}), shellBounce: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('STU')],volume:0.2}), quarkPop: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('VWX')],volume:0.3}), subQuarkPop: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('YZA')],volume:0.2}), humanToProg: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('BCD')],volume:0.35}), progDestroy: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('EFG')],volume:0.25}), extraLife: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('HIJ')],volume:0.5}), insertCoin: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('K01')],volume:0.4}), humanRescue: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('654')],volume:0.3}), waveStart: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('789')],volume:0.4}), humanDeathByEnemy: new Howl({src:['data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'+Array(100).join('987')],volume:0.3}) };

        // === FULLY RESTORED CORE FUNCTIONS START ===
        // Load sprite textures
        const playerTexture = PIXI.Texture.from('sprites/player.png');
        const gruntTexture = PIXI.Texture.from('sprites/grunt.png');
        const humanTexture = PIXI.Texture.from('sprites/humans.png');
        
        // Score and bonus system
        // Score is already declared in game state section
        bonusPoints = 1000;
        lastHumanRescueTime = 0;
        const HUMAN_BONUS_RESET_TIME = 2000; // 2 seconds
        const EXTRA_LIFE_THRESHOLD = 25000;

        // Enemy point values
        const POINTS = {
            GRUNT: 100,
            ENFORCER: 150,
            SPHEROID: 1000,
            BRAIN: 500,
            TANK: 300,
            PROG: 100,
            QUARK: 1000,
            SUB_QUARK: 500
        };

        function createPlayer() { 
            if (player && player.sprite && !player.sprite._destroyed) player.sprite.destroy();
            const playerSprite = new PIXI.Sprite(playerTexture);
            playerSprite.anchor.set(0.5); // Center the sprite's pivot point
            playerSprite.x = GAME_WIDTH / 2;
            playerSprite.y = GAME_HEIGHT / 2;
            playerContainer.addChild(playerSprite);
            player = { 
                sprite: playerSprite, 
                dx: 0, 
                dy: 0, 
                shootCooldown: 0,
                lastShootTime: 0,
                shootDelay: 8,
                isAlive: true 
            };
            return player;
        }

        // Update projectiles movement and collisions
        function updateProjectiles() {
            for (let i = playerProjectiles.length - 1; i >= 0; i--) {
                const p = playerProjectiles[i];
                p.sprite.x += p.dx;
                p.sprite.y += p.dy;
                
                // Remove projectiles that are off screen
                if (p.sprite.x < 0 || p.sprite.x > GAME_WIDTH || 
                    p.sprite.y < 0 || p.sprite.y > GAME_HEIGHT) {
                    p.sprite.destroy();
                    playerProjectiles.splice(i, 1);
                }
            }
        }

        // playerProjectiles array is already declared
        function createPlayerProjectile(x, y, dx, dy) {
            if (playerProjectiles.length >= MAX_PLAYER_PROJECTILES) return;
            const projectileSprite = new PIXI.Graphics();
            projectileSprite.beginFill(0xFFFF00); projectileSprite.drawRect(-1, -2, 2, 4); projectileSprite.endFill();
            projectileSprite.x = x; projectileSprite.y = y;
            playerProjectilesContainer.addChild(projectileSprite);
            playerProjectiles.push({ sprite: projectileSprite, dx: dx * PROJECTILE_SPEED, dy: dy * PROJECTILE_SPEED });
            SoundManager.play('shoot');
        }

        // enemyProjectiles array is already declared
        function createEnforcerProjectile(x, y, targetX, targetY) {
            const projectileSprite = new PIXI.Graphics();
            projectileSprite.beginFill(0x00FFFF); 
            projectileSprite.moveTo(0, -3); projectileSprite.lineTo(2, 0);
            projectileSprite.lineTo(0, 3); projectileSprite.lineTo(-2, 0);
            projectileSprite.closePath(); projectileSprite.endFill();
            projectileSprite.x = x; projectileSprite.y = y;
            const angle = Math.atan2(targetY - y, targetX - x);
            enemyProjectilesContainer.addChild(projectileSprite);
            enemyProjectiles.push({
                sprite: projectileSprite, type: 'enforcer_shot',
                dx: Math.cos(angle) * ENFORCER_PROJECTILE_SPEED,
                dy: Math.sin(angle) * ENFORCER_PROJECTILE_SPEED
            });
            SoundManager.play('enforcerFire');
        }

        function createBrainProjectile(x, y, targetX, targetY) {
            const projectileSprite = new PIXI.Graphics();
            projectileSprite.beginFill(0xFF88FF); 
            projectileSprite.drawCircle(0,0,3); 
            projectileSprite.endFill();
            projectileSprite.x = x; projectileSprite.y = y;
            const angle = Math.atan2(targetY - y, targetX - x);
            enemyProjectilesContainer.addChild(projectileSprite);
            enemyProjectiles.push({
                sprite: projectileSprite, type: 'brain_shot',
                dx: Math.cos(angle) * BRAIN_PROJECTILE_SPEED,
                dy: Math.sin(angle) * BRAIN_PROJECTILE_SPEED
            });
            SoundManager.play('brainFire');
        }

        function createTankShell(x, y, targetX, targetY) {
            const shellSprite = new PIXI.Graphics();
            shellSprite.beginFill(0x888888); 
            shellSprite.drawCircle(0,0,4); 
            shellSprite.endFill();
            shellSprite.x = x; shellSprite.y = y;
            const angle = Math.atan2(targetY - y, targetX - x);
            enemyProjectilesContainer.addChild(shellSprite);
            enemyProjectiles.push({
                sprite: shellSprite, type: 'tank_shell',
                dx: Math.cos(angle) * TANK_SHELL_SPEED,
                dy: Math.sin(angle) * TANK_SHELL_SPEED,
                bouncesLeft: TANK_SHELL_BOUNCES
            });
            SoundManager.play('tankFire');
        }

        // enemies array is already declared
        // Helper function to create animated sprites
        function createAnimatedSprite(frames, animationSpeed = 0.1) {
            const container = new PIXI.Container();
            container.frames = frames;
            container.currentFrame = 0;
            container.animationTimer = 0;
            container.animationSpeed = animationSpeed;
            
            // Create the initial frame
            const initialFrame = new PIXI.Graphics();
            frames[0](initialFrame);
            container.addChild(initialFrame);
            container.currentGraphics = initialFrame;
            
            return container;
        }
        
        // Update animation frame
        function updateSpriteAnimation(sprite, delta) {
            if (!sprite.frames) return;
            
            sprite.animationTimer += delta;
            if (sprite.animationTimer >= sprite.animationSpeed) {
                sprite.animationTimer = 0;
                sprite.currentFrame = (sprite.currentFrame + 1) % sprite.frames.length;
                
                // Remove old frame and create new one
                sprite.removeChild(sprite.currentGraphics);
                const newFrame = new PIXI.Graphics();
                sprite.frames[sprite.currentFrame](newFrame);

        const keys = {};

        // Gamepad Handling
        let gamepadConnected = false;
        let gamepadLoopActive = false;
        
        // Start gamepad polling immediately
        function pollGamepads() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if (gamepads) {
                for (let i = 0; i < gamepads.length; i++) {
                    if (gamepads[i]) {

                        gamepadConnected = true;
                        initGamepad();
                    }
                }
            }
            requestAnimationFrame(pollGamepads);
        }
        
        // Start polling immediately
        pollGamepads();

        // Update gamepad state in animation frame
        function updateGamepadState() {
            if (gamepadConnected) {
                const gamepads = navigator.getGamepads();
                if (gamepads) {
                    for (const gamepad of gamepads) {
                        if (gamepad) {
                            // Process gamepad state
                            handleGamepadState(gamepad);
                        }
                    }
                }
            }
            requestAnimationFrame(updateGamepadState);
        }

        // Start gamepad state updates
        updateGamepadState();

        // Initialize gamepad support
        function initGamepad() {
            if (!gamepadLoopActive) {
                gamepadLoopActive = true;
                requestAnimationFrame(updateGamepads);

            }
        }

        // Continuously poll for gamepad updates
        function updateGamepads() {
            if (!gamepadLoopActive) return;

            const gamepads = navigator.getGamepads();
            for (const gamepad of gamepads) {
                if (gamepad) {
                    handleGamepadState(gamepad);
                }
            }

            requestAnimationFrame(updateGamepads);
        }

        // Handle individual gamepad state
        function handleGamepadState(gamepad) {
            if (!gamepad || !gamepad.connected) return;
            
            // Only log state changes
            if (gamepad.timestamp !== lastGamepadTimestamp) {
                
                // Update movement and shooting values
                gamepadMovementX = Math.abs(gamepad.axes[0]) > GAMEPAD_DEADZONE ? gamepad.axes[0] : 0;
                gamepadMovementY = Math.abs(gamepad.axes[1]) > GAMEPAD_DEADZONE ? gamepad.axes[1] : 0;
                gamepadShootingX = Math.abs(gamepad.axes[2]) > GAMEPAD_DEADZONE ? gamepad.axes[2] : 0;
                gamepadShootingY = Math.abs(gamepad.axes[3]) > GAMEPAD_DEADZONE ? gamepad.axes[3] : 0;



                // Check buttons
                if (gamepad.buttons[GAMEPAD_START_BUTTON_INDEX]?.pressed || 
                    gamepad.buttons[GAMEPAD_A_BUTTON_INDEX]?.pressed) {

                    if (gameState === 'TITLE_SCREEN') {
                        startGameFromTitle();
                    }
                }

                lastGamepadTimestamp = gamepad.timestamp;
            }
        }

        window.addEventListener("gamepadconnected", (e) => {

            gamepadConnected = true;
            initGamepad();
        });

        window.addEventListener("gamepaddisconnected", (e) => {

            gamepadConnected = false;
        });

        function handleGamepadInput() {
            if (!gamepadConnected) return false;

            const activeGamepads = navigator.getGamepads();
            if (!activeGamepads) return false;

            let gamepadInputProcessed = false;

            
            for (const gamepad of activeGamepads) {
                if (!gamepad) continue; // Skip disconnected gamepads

                if (gamepad.timestamp !== lastGamepadTimestamp) {
                    lastGamepadTimestamp = gamepad.timestamp;
                }

                // Movement (left stick)
                gamepadMovementX = Math.abs(gamepad.axes[0]) > GAMEPAD_DEADZONE ? gamepad.axes[0] : 0;
                gamepadMovementY = Math.abs(gamepad.axes[1]) > GAMEPAD_DEADZONE ? gamepad.axes[1] : 0;

                // Shooting (right stick)
                gamepadShootingX = Math.abs(gamepad.axes[2]) > GAMEPAD_DEADZONE ? gamepad.axes[2] : 0;
                gamepadShootingY = Math.abs(gamepad.axes[3]) > GAMEPAD_DEADZONE ? gamepad.axes[3] : 0;

                // Start button
                if (gamepad.buttons[GAMEPAD_START_BUTTON_INDEX].pressed) {
                    if (gameState === 'TITLE_SCREEN') {
                        startGameFromTitle();
                        gamepadInputProcessed = true;
                    }
                }

                // A button (alternative start)
                if (gamepad.buttons[GAMEPAD_A_BUTTON_INDEX].pressed) {
                    if (gameState === 'TITLE_SCREEN') {
                        startGameFromTitle();
                        gamepadInputProcessed = true;
                    }
                }

                if (Math.abs(gamepadMovementX) > GAMEPAD_DEADZONE || 
                    Math.abs(gamepadMovementY) > GAMEPAD_DEADZONE || 
                    Math.abs(gamepadShootingX) > GAMEPAD_DEADZONE || 
                    Math.abs(gamepadShootingY) > GAMEPAD_DEADZONE) {
                    gamepadInputProcessed = true;
                }
            }

            for (const gp of activeGamepads) {
                if (gp) {
                    if ((gameState === 'TITLE_SCREEN' || gameState === 'HIGH_SCORE_DISPLAY_SCREEN' || gameState === 'DEMO_PLAY') && gp.buttons[GAMEPAD_START_BUTTON_INDEX] && gp.buttons[GAMEPAD_START_BUTTON_INDEX].pressed) {
                        if (!gp.buttons[GAMEPAD_START_BUTTON_INDEX].wasPressed) {
                             startGameFromTitle();
                             gp.buttons[GAMEPAD_START_BUTTON_INDEX].wasPressed = true; 
                             return true; 
                        }
                    } else if (gp.buttons[GAMEPAD_START_BUTTON_INDEX]) {
                        gp.buttons[GAMEPAD_START_BUTTON_INDEX].wasPressed = false; 
                    }
                    
                    if (gameState !== 'PLAYING' || !player || !player.isAlive) continue;

                    let moveX = gp.axes[0];
                    let moveY = gp.axes[1];

                    if (Math.abs(moveX) < GAMEPAD_DEADZONE) moveX = 0;
                    if (Math.abs(moveY) < GAMEPAD_DEADZONE) moveY = 0;

                    if (moveX !== 0 || moveY !== 0) {
                        player.dx = moveX;
                        player.dy = moveY;
                        const length = Math.sqrt(player.dx * player.dx + player.dy * player.dy);
                        if (length > 1) { 
                           player.dx /= length;
                           player.dy /= length;
                        }
                        gamepadInputProcessed = true;
                    }

                    let shootX = gp.axes[2] || 0; 
                    let shootY = gp.axes[3] || 0;

                    if (Math.abs(shootX) < GAMEPAD_DEADZONE) shootX = 0;
                    if (Math.abs(shootY) < GAMEPAD_DEADZONE) shootY = 0;

                    const currentTime = Date.now();
                    if (currentTime - player.lastShootTime >= PLAYER_SHOOT_RATE && (shootX !== 0 || shootY !== 0)) {
                        const shootLength = Math.sqrt(shootX * shootX + shootY * shootY);
                        if (shootLength > 0) { 
                            createPlayerProjectile(player.sprite.x, player.sprite.y, shootX / shootLength, shootY / shootLength);
                            player.lastShootTime = currentTime;
                            sounds.shoot.play();
                            gamepadInputProcessed = true;
                        }
                    }
                    if(gamepadInputProcessed) break; 
                }
            }
            return gamepadInputProcessed; 
        }


        function handleInput() { 
            if (!player || !player.isAlive || gameState !== 'PLAYING') return;
            
            const gamepadUsed = handleGamepadInput();

            if (gamepadUsed) {
                if (player.shootCooldown > 0) player.shootCooldown--;
                return; 
            }

            player.dx = 0; player.dy = 0; 
            if (keys['KeyW']) player.dy = -1; 
            if (keys['KeyS']) player.dy = 1;
            if (keys['KeyA']) player.dx = -1; 
            if (keys['KeyD']) player.dx = 1;

            if (player.dx !== 0 && player.dy !== 0) { 
                const length = Math.sqrt(player.dx * player.dx + player.dy * player.dy); 
                player.dx /= length; player.dy /= length; 
            }

            const currentTime = Date.now();
            if (currentTime - player.lastShootTime >= PLAYER_SHOOT_RATE) {
                let shootX = 0, shootY = 0;
                if (keys['ArrowUp']) shootY = -1; 
                if (keys['ArrowDown']) shootY = 1;
                if (keys['ArrowLeft']) shootX = -1; 
                if (keys['ArrowRight']) shootX = 1;
                if (shootX !== 0 || shootY !== 0) {
                    if (shootX !== 0 && shootY !== 0) { 
                        const length = Math.sqrt(shootX * shootX + shootY * shootY); 
                        shootX /= length; shootY /= length; 
                    }
                    createPlayerProjectile(player.sprite.x, player.sprite.y, shootX, shootY);
                    player.lastShootTime = currentTime;
                    sounds.shoot.play();
                }
            }
        }
        
        function updatePlayer(delta, p = player) { 
            if (!p || !p.isAlive || !p.sprite || p.sprite._destroyed) return;
            if (gameState !== 'PLAYING' && gameState !== 'DEMO_PLAY') return;

            if (p.isDemoPlayer) {
                p.aiMoveTimer -= delta;
                if (p.aiMoveTimer <= 0) {
                    p.dx = (Math.random() - 0.5) * 2; 
                    p.dy = (Math.random() - 0.5) * 2;
                    const len = Math.sqrt(p.dx * p.dx + p.dy * p.dy);
                    if (len > 0) { p.dx /= len; p.dy /= len; }
                    p.aiMoveTimer = 60 + Math.random() * 60; 
                }

                p.aiShootTimer -= delta;
                if (p.aiShootTimer <= 0) {
                    const shootDx = (Math.random() - 0.5) * 2;
                    const shootDy = (Math.random() - 0.5) * 2;
                    const shootLen = Math.sqrt(shootDx*shootDx + shootDy*shootDy);
                    if(shootLen > 0) {
                        createPlayerProjectile(p.sprite.x, p.sprite.y, shootDx/shootLen, shootDy/shootLen, true);
                    }
                    p.aiShootTimer = p.shootDelay + Math.random() * 30; 
                }
            }

            p.sprite.x += p.dx * PLAYER_SPEED * delta;
            p.sprite.y += p.dy * PLAYER_SPEED * delta;
            p.sprite.x = Math.max(5, Math.min(GAME_WIDTH - 5, p.sprite.x));
            p.sprite.y = Math.max(5, Math.min(GAME_HEIGHT - 5, p.sprite.y));

            if (!p.isDemoPlayer && playerInvulnerableTime > 0) {
                playerInvulnerableTime -= app.ticker.elapsedMS; 
                
                // Create a pulsing shield effect
                const invulnerablePhase = (playerInvulnerableTime / 1000) * Math.PI * 2;
                const baseAlpha = 0.7 + Math.sin(invulnerablePhase * 3) * 0.3;
                p.sprite.alpha = baseAlpha;
                
                // Add a shield glow effect if it doesn't exist
                if (!p.shieldEffect) {
                    p.shieldEffect = new PIXI.Graphics();
                    p.shieldEffect.beginFill(0x00FFFF, 0.2);
                    p.shieldEffect.drawCircle(0, 0, 12);
                    p.shieldEffect.endFill();
                    p.sprite.addChild(p.shieldEffect);
                }
                
                // Animate the shield
                const shieldScale = 1 + Math.sin(invulnerablePhase * 2) * 0.2;
                p.shieldEffect.scale.set(shieldScale);
                p.shieldEffect.rotation = invulnerablePhase;
                p.shieldEffect.alpha = 0.3 + Math.sin(invulnerablePhase * 4) * 0.2;
                
                if (playerInvulnerableTime <= 0) {
                    p.sprite.alpha = 1.0;
                    if (p.shieldEffect) {
                        p.sprite.removeChild(p.shieldEffect);
                        p.shieldEffect.destroy();
                        p.shieldEffect = null;
                    }
                }
            }
        }

        function updatePlayerProjectiles(delta) {
            if (gameState !== 'PLAYING' && gameState !== 'DEMO_PLAY') return;
            for (let i = playerProjectiles.length - 1; i >= 0; i--) {
                const p = playerProjectiles[i];
                if (!p || !p.sprite || p.sprite._destroyed) { 
                    playerProjectiles.splice(i, 1);
                    continue;
                }
                p.sprite.x += p.dx * delta; p.sprite.y += p.dy * delta;
                if (p.sprite.x < 0 || p.sprite.x > GAME_WIDTH || p.sprite.y < 0 || p.sprite.y > GAME_HEIGHT) {
                    if (p.sprite && !p.sprite._destroyed) p.sprite.destroy(); 
                    playerProjectiles.splice(i, 1);
                }
            }
        }
        function updateEnemyProjectiles(delta) {
            if (gameState !== 'PLAYING' && gameState !== 'DEMO_PLAY') return;
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const p = enemyProjectiles[i];
                 if (!p || !p.sprite || p.sprite._destroyed) { 
                    enemyProjectiles.splice(i, 1);
                    continue;
                }
                p.sprite.x += p.dx * delta;
                p.sprite.y += p.dy * delta;

                if (p.type === 'tank_shell') {
                    let bounced = false;
                    if (p.sprite.x <= 0 || p.sprite.x >= GAME_WIDTH) {
                        if (p.bouncesLeft > 0) {
                            p.dx *= -1; p.bouncesLeft--; bounced = true;
                            p.sprite.x = Math.max(1, Math.min(GAME_WIDTH - 1, p.sprite.x)); 
                        } else {
                            if (p.sprite && !p.sprite._destroyed) p.sprite.destroy();
                            enemyProjectiles.splice(i, 1); continue;
                        }
                    }
                    if (p.sprite.y <= 0 || p.sprite.y >= GAME_HEIGHT) {
                         if (p.bouncesLeft > 0) {
                            p.dy *= -1; p.bouncesLeft--; bounced = true;
                            p.sprite.y = Math.max(1, Math.min(GAME_HEIGHT - 1, p.sprite.y)); 
                        } else {
                            if (p.sprite && !p.sprite._destroyed) p.sprite.destroy();
                            enemyProjectiles.splice(i, 1); continue;
                        }
                    }
                    if (bounced) SoundManager.play('shellBounce');
                } else { 
                    if (p.sprite.x < -10 || p.sprite.x > GAME_WIDTH + 10 || p.sprite.y < -10 || p.sprite.y > GAME_HEIGHT + 10) { 
                        if (p.sprite && !p.sprite._destroyed) p.sprite.destroy(); 
                        enemyProjectiles.splice(i, 1);
                    }
                }
            }
        }

        function updateEnemies(delta) {
            const currentPlayer = gameState === 'DEMO_PLAY' ? demoPlayer : player;
            if (gameState !== 'PLAYING' && gameState !== 'DEMO_PLAY') return;
            if (!currentPlayer || !currentPlayer.sprite || currentPlayer.sprite._destroyed) return;
            
            // Update all enemy animations
            for (const enemy of enemies) {
                if (enemy.sprite && !enemy.sprite._destroyed) {
                    updateSpriteAnimation(enemy.sprite, delta);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (!enemy || !enemy.sprite || enemy.sprite._destroyed) { 
                    enemies.splice(i,1);
                    continue;
                }

                if (enemy.type === 'grunt') {
                    // Calculate angle to player
                    const targetAngle = Math.atan2(
                        currentPlayer.sprite.y - enemy.sprite.y,
                        currentPlayer.sprite.x - enemy.sprite.x
                    );
                    
                    // Smoothly turn towards player
                    let angleDiff = targetAngle - enemy.lastAngle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    enemy.lastAngle += angleDiff * GRUNT_TURN_RATE;
                    
                    // Accelerate in the current direction
                    const targetDx = Math.cos(enemy.lastAngle) * enemy.speed;
                    const targetDy = Math.sin(enemy.lastAngle) * enemy.speed;
                    
                    enemy.dx += (targetDx - enemy.dx) * GRUNT_ACCELERATION;
                    enemy.dy += (targetDy - enemy.dy) * GRUNT_ACCELERATION;
                    
                    // Increase speed as the grunt gets closer to the player
                    const distToPlayer = Math.hypot(
                        currentPlayer.sprite.x - enemy.sprite.x,
                        currentPlayer.sprite.y - enemy.sprite.y
                    );
                    const speedMultiplier = Math.max(0.5, Math.min(1, 1 - (distToPlayer / 200)));
                    enemy.speed = GRUNT_SPEED + (GRUNT_MAX_SPEED - GRUNT_SPEED) * speedMultiplier;
                    
                    // Update position
                    enemy.sprite.x += enemy.dx * delta;
                    enemy.sprite.y += enemy.dy * delta;
                    
                    // Keep in bounds
                    if (enemy.sprite.x < 6) {
                        enemy.sprite.x = 6;
                        enemy.dx *= -0.5;
                    } else if (enemy.sprite.x > GAME_WIDTH - 6) {
                        enemy.sprite.x = GAME_WIDTH - 6;
                        enemy.dx *= -0.5;
                    }
                    if (enemy.sprite.y < 6) {
                        enemy.sprite.y = 6;
                        enemy.dy *= -0.5;
                    } else if (enemy.sprite.y > GAME_HEIGHT - 6) {
                        enemy.sprite.y = GAME_HEIGHT - 6;
                        enemy.dy *= -0.5;
                    }
                } else if (enemy.type === 'hulk') {
                    enemy.wanderTimer -= delta;
                    if (enemy.isCharging && enemy.chargeTarget && enemy.chargeTarget.sprite && !enemy.chargeTarget.sprite._destroyed) {
                        const angle = Math.atan2(enemy.chargeTarget.sprite.y - enemy.sprite.y, enemy.chargeTarget.sprite.x - enemy.sprite.x);
                        enemy.sprite.x += Math.cos(angle) * HULK_CHARGE_SPEED * delta;
                        enemy.sprite.y += Math.sin(angle) * HULK_CHARGE_SPEED * delta;
                        if (isColliding(enemy.sprite, enemy.chargeTarget.sprite, 10) || enemy.wanderTimer <= 0) {
                            enemy.isCharging = false; enemy.chargeTarget = null;
                            enemy.wanderTimer = Math.random() * 120 + 60;
                        }
                    } else { 
                        enemy.isCharging = false; 
                        if (enemy.wanderTimer <= 0) {
                            const targetableHumans = humansAndProgs.filter(h => h.type === 'human' && h.sprite && !h.sprite._destroyed);
                            if (targetableHumans.length > 0 && Math.random() < 0.3) { 
                                enemy.isCharging = true;
                                enemy.chargeTarget = targetableHumans[Math.floor(Math.random() * targetableHumans.length)];
                                enemy.wanderTimer = Math.random() * 60 + 30; 
                            } else { 
                                enemy.dx = (Math.random() - 0.5) * HULK_SPEED * 2;
                                enemy.dy = (Math.random() - 0.5) * HULK_SPEED * 2;
                                enemy.wanderTimer = Math.random() * 120 + 60;
                            }
                        }
                        enemy.sprite.x += enemy.dx * delta; enemy.sprite.y += enemy.dy * delta;
                        if (enemy.sprite.x < 8 || enemy.sprite.x > GAME_WIDTH - 8) {enemy.dx *= -1; enemy.sprite.x = Math.max(8, Math.min(GAME_WIDTH - 8, enemy.sprite.x));}
                        if (enemy.sprite.y < 10 || enemy.sprite.y > GAME_HEIGHT - 10) {enemy.dy *= -1; enemy.sprite.y = Math.max(10, Math.min(GAME_HEIGHT - 10, enemy.sprite.y));}
                    }
                } else if (enemy.type === 'spheroid') {
                    enemy.sprite.x += enemy.dx * delta; enemy.sprite.y += enemy.dy * delta;
                    if (enemy.sprite.x < 6 || enemy.sprite.x > GAME_WIDTH - 6) {enemy.dx *= -1; enemy.sprite.x = Math.max(6, Math.min(GAME_WIDTH - 6, enemy.sprite.x));}
                    if (enemy.sprite.y < 6 || enemy.sprite.y > GAME_HEIGHT - 6) {enemy.dy *= -1; enemy.sprite.y = Math.max(6, Math.min(GAME_HEIGHT - 6, enemy.sprite.y));}
                    enemy.pulseTimer += enemy.pulseRate * delta;
                    enemy.sprite.alpha = 0.75 + Math.sin(enemy.pulseTimer) * 0.25;
                    if (enemy.enforcersSpawned < enemy.maxEnforcersToSpawn) {
                        enemy.spawnEnforcerTimer -= delta;
                        if (enemy.spawnEnforcerTimer <= 0) {
                            createEnforcer(enemy.sprite.x, enemy.sprite.y);
                            enemy.enforcersSpawned++;
                            enemy.spawnEnforcerTimer = SPHEROID_SPAWN_ENFORCER_DELAY; 
                        }
                    }
                } else if (enemy.type === 'enforcer') {
                    if (!currentPlayer || !currentPlayer.sprite || currentPlayer.sprite._destroyed) return;
                    const angle = Math.atan2(currentPlayer.sprite.y - enemy.sprite.y, currentPlayer.sprite.x - enemy.sprite.x);
                    enemy.sprite.x += Math.cos(angle) * ENFORCER_SPEED * delta;
                    enemy.sprite.y += Math.sin(angle) * ENFORCER_SPEED * delta;
                    enemy.shootTimer -= delta;
                    if (enemy.shootTimer <= 0 && currentPlayer.isAlive) {
                        createEnforcerProjectile(enemy.sprite.x, enemy.sprite.y, currentPlayer.sprite.x, currentPlayer.sprite.y);
                        enemy.shootTimer = ENFORCER_SHOOT_DELAY;
                    }
                } else if (enemy.type === 'brain') {
                    let targetX = (currentPlayer && currentPlayer.sprite && !currentPlayer.sprite._destroyed) ? currentPlayer.sprite.x : enemy.sprite.x;
                    let targetY = (currentPlayer && currentPlayer.sprite && !currentPlayer.sprite._destroyed) ? currentPlayer.sprite.y : enemy.sprite.y;
                    let closestHumanDist = Infinity;
                    const targetableHumans = humansAndProgs.filter(h => h.type === 'human' && h.sprite && !h.sprite._destroyed && !h.isRescued);

                    enemy.reprogramTarget = null; 
                    if (targetableHumans.length > 0) {
                        targetableHumans.forEach(human => {
                            if (human.sprite && !human.sprite._destroyed) { 
                                const dist = Math.hypot(human.sprite.x - enemy.sprite.x, human.sprite.y - enemy.sprite.y);
                                if (dist < closestHumanDist) {
                                    closestHumanDist = dist; targetX = human.sprite.x; targetY = human.sprite.y;
                                    enemy.reprogramTarget = human;
                                }
                            }
                        });
                        
                        if (enemy.reprogramTarget && enemy.reprogramTarget.sprite && !enemy.reprogramTarget.sprite._destroyed && closestHumanDist < BRAIN_REPROGRAM_RANGE) {
                             enemy.reprogramTimer -= delta;
                             enemy.reprogramProgress += delta;
                             
                             // Visual feedback during reprogramming
                             if (enemy.reprogramTarget) {
                                 const progress = enemy.reprogramProgress / BRAIN_REPROGRAM_DURATION;
                                  enemy.reprogramTarget.sprite.tint = progress >= 0.5 ? 0xFF0000 : 0xFFAA00;
                             }
                             
                             if(enemy.reprogramTimer <= 0) {
                                 // Complete reprogramming
                                 if (enemy.reprogramTarget) {
                                      enemy.reprogramTarget.isEvil = true;
                                      enemy.reprogramTarget.sprite.tint = 0xFF0000;
                                     SoundManager.play('brain_reprogram');
                                 }
                                 convertToProg(enemy.reprogramTarget);
                                 enemy.reprogramTarget = null; 
                                enemy.reprogramTimer = BRAIN_REPROGRAM_DURATION; 
                             }
                        } else {
                            enemy.reprogramTimer = BRAIN_REPROGRAM_DURATION; 
                        }
                    }
                    
                    const angle = Math.atan2(targetY - enemy.sprite.y, targetX - enemy.sprite.x);
                    enemy.sprite.x += Math.cos(angle) * BRAIN_SPEED * delta;
                    enemy.sprite.y += Math.sin(angle) * BRAIN_SPEED * delta;
                    enemy.shootTimer -= delta;
                    if (enemy.shootTimer <= 0 && currentPlayer && currentPlayer.isAlive && currentPlayer.sprite && !currentPlayer.sprite._destroyed) {
                        createBrainProjectile(enemy.sprite.x, enemy.sprite.y, currentPlayer.sprite.x, currentPlayer.sprite.y);
                        enemy.shootTimer = BRAIN_SHOOT_DELAY;
                    }
                } else if (enemy.type === 'tank') {
                    if (!currentPlayer || !currentPlayer.sprite || currentPlayer.sprite._destroyed) return;
                    const angle = Math.atan2(currentPlayer.sprite.y - enemy.sprite.y, currentPlayer.sprite.x - enemy.sprite.x);
                    enemy.sprite.x += Math.cos(angle) * TANK_SPEED * delta;
                    enemy.sprite.y += Math.sin(angle) * TANK_SPEED * delta;
                    enemy.shootTimer -= delta;
                    if (enemy.shootTimer <= 0 && currentPlayer.isAlive) {
                        createTankShell(enemy.sprite.x, enemy.sprite.y, currentPlayer.sprite.x, currentPlayer.sprite.y);
                        enemy.shootTimer = TANK_SHOOT_DELAY;
                    }
                } else if (enemy.type === 'quark') {
                    enemy.sprite.x += enemy.dx * delta;
                    enemy.sprite.y += enemy.dy * delta;
                    if (enemy.sprite.x < 4 || enemy.sprite.x > GAME_WIDTH - 4) {enemy.dx *= -1; enemy.sprite.x = Math.max(4, Math.min(GAME_WIDTH - 4, enemy.sprite.x));}
                    if (enemy.sprite.y < 4 || enemy.sprite.y > GAME_HEIGHT - 4) {enemy.dy *= -1; enemy.sprite.y = Math.max(4, Math.min(GAME_HEIGHT - 4, enemy.sprite.y));}

                    if (enemy.subQuarksSpawned < enemy.maxSubQuarksToSpawn) {
                        enemy.spawnSubQuarkTimer -= delta;
                        if (enemy.spawnSubQuarkTimer <= 0) {
                            createSubQuark(enemy.sprite.x, enemy.sprite.y);
                            enemy.subQuarksSpawned++;
                            enemy.spawnSubQuarkTimer = QUARK_SPAWN_SUB_QUARK_DELAY;
                        }
                    }
                } else if (enemy.type === 'sub_quark') {
                    enemy.sprite.x += enemy.dx * delta;
                    enemy.sprite.y += enemy.dy * delta;
                    enemy.lifeTimer -= delta;
                    if (enemy.lifeTimer <=0 || enemy.sprite.x < -2 || enemy.sprite.x > GAME_WIDTH + 2 || enemy.sprite.y < -2 || enemy.sprite.y > GAME_HEIGHT + 2) {
                        if(enemy.sprite && !enemy.sprite._destroyed) enemy.sprite.destroy();
                        enemies.splice(i,1); 
                    }
                }
            }
        }
        
        function updateObstacles(delta) {
            if (gameState !== 'PLAYING' && gameState !== 'DEMO_PLAY') return;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                if (!obstacle || !obstacle.sprite || obstacle.sprite._destroyed) {
                    obstacles.splice(i, 1);
                    continue;
                }
                if (obstacle.type === 'electrode') {
                    obstacle.flashTimer += ELECTRODE_FLASH_RATE * delta;
                    const flashPhase = obstacle.flashTimer % (Math.PI * 4);
                    const baseFlash = Math.sin(flashPhase);
                    const rapidFlash = Math.sin(flashPhase * 3) * 0.3;
                    
                    // Combine slow pulse with rapid flicker
                    obstacle.sprite.alpha = 0.7 + (baseFlash + rapidFlash) * 0.3;
                    
                    // Add subtle color shift
                    const colorPhase = (1 + Math.sin(flashPhase * 0.5)) * 0.5;
                    obstacle.sprite.tint = PIXI.utils.rgb2hex([1, 1, 0.6 + colorPhase * 0.4]);
                }
            }
        }

        function updateHumansAndProgs(delta) {
            const currentPlayer = gameState === 'DEMO_PLAY' ? demoPlayer : player;
            if (gameState !== 'PLAYING' && gameState !== 'DEMO_PLAY') return;

            for (let i = humansAndProgs.length - 1; i >= 0; i--) {
                const entity = humansAndProgs[i];
                 if (!entity || !entity.sprite || entity.sprite._destroyed) {
                    humansAndProgs.splice(i,1);
                    continue;
                }

                if (entity.type === 'human') {
                    entity.wanderTimer -= delta;
                    if (entity.wanderTimer <= 0) {
                        entity.dx = (Math.random() - 0.5) * HUMAN_SPEED * 2; 
                        entity.dy = (Math.random() - 0.5) * HUMAN_SPEED * 2;
                        entity.wanderTimer = Math.random() * 100 + 50;
                    }
                    entity.sprite.x += entity.dx * delta; 
                    entity.sprite.y += entity.dy * delta;
                    if (entity.sprite.x < 5 || entity.sprite.x > GAME_WIDTH - 5) {entity.dx *= -1; entity.sprite.x = Math.max(5, Math.min(GAME_WIDTH - 5, entity.sprite.x));}
                    if (entity.sprite.y < 5 || entity.sprite.y > GAME_HEIGHT - 5) {entity.dy *= -1; entity.sprite.y = Math.max(5, Math.min(GAME_HEIGHT - 5, entity.sprite.y));}
                } else if (entity.type === 'prog') {
                    if (currentPlayer && currentPlayer.sprite && !currentPlayer.sprite._destroyed) {
                        const angle = Math.atan2(currentPlayer.sprite.y - entity.sprite.y, currentPlayer.sprite.x - entity.sprite.x);
                        const erraticAngle = angle + (Math.random() - 0.5) * 0.5; 
                        entity.sprite.x += Math.cos(erraticAngle) * PROG_SPEED * delta;
                        entity.sprite.y += Math.sin(erraticAngle) * PROG_SPEED * delta;
                    }
                    entity.flashTimer += 0.2 * delta; 
                    entity.sprite.alpha = 0.5 + Math.sin(entity.flashTimer) * 0.5;
                    entity.sprite.x = Math.max(5, Math.min(GAME_WIDTH - 5, entity.sprite.x));
                    entity.sprite.y = Math.max(5, Math.min(GAME_HEIGHT - 5, entity.sprite.y));
                }
            }
        }

        function updateBonusDecay(delta) {
            if (gameState !== 'PLAYING') return; 
            if (humanRescueBonusDecayTimer > 0) {
                humanRescueBonusDecayTimer -= delta;
                if (humanRescueBonusDecayTimer <= 0) {
                    currentHumanRescueBonus = INITIAL_HUMAN_RESCUE_BONUS;
                    humanRescueBonusDecayTimer = 0; 
                    console.log("Human rescue bonus decayed.");
                }
            }
        }

        function checkForExtraLife() {
            if (gameState !== 'PLAYING') return; 
            if (score >= nextExtraLifeScore) {
                lives++;
                nextExtraLifeScore += EXTRA_LIFE_SCORE_INTERVAL;
                console.log(`Extra life awarded! Lives: ${lives}. Next at: ${nextExtraLifeScore}`);
                SoundManager.play('extraLife');
            }
        }

        function checkCollisions() {
            const currentPlayer = gameState === 'DEMO_PLAY' ? demoPlayer : player;
            if (gameState !== 'PLAYING' && gameState !== 'DEMO_PLAY') return;
            if (!currentPlayer || !currentPlayer.isAlive || !currentPlayer.sprite || currentPlayer.sprite._destroyed) return;

            // Player/Demo Projectile vs Enemy 
            for (let i = playerProjectiles.length - 1; i >= 0; i--) {
                const p = playerProjectiles[i];
                if (!p || !p.sprite || p.sprite._destroyed) continue;
                
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (!enemy || !enemy.sprite || enemy.sprite._destroyed || enemy.indestructible) continue;

                    if (isColliding(p.sprite, enemy.sprite, 5)) {
                        if (p.sprite && !p.sprite._destroyed) p.sprite.destroy(); 
                        playerProjectiles.splice(i, 1);
                        
                        enemy.health--;
                        if (enemy.health <= 0) {
                            let explosionColor = 0xFF0000; 
                            let soundToPlay = sounds.enemyDestroy;

                            if (enemy.type === 'spheroid') { explosionColor = 0xFF8800; soundToPlay = sounds.spheroidPop;
                            } else if (enemy.type === 'enforcer') { explosionColor = 0x00AAFF; 
                            } else if (enemy.type === 'brain') { explosionColor = 0xFF88FF; soundToPlay = sounds.brainDestroy;
                            } else if (enemy.type === 'tank') { explosionColor = 0xAAAAAA; soundToPlay = sounds.tankDestroy;
                            } else if (enemy.type === 'quark') { explosionColor = 0xF0F0F0; soundToPlay = sounds.quarkPop;
                            } else if (enemy.type === 'sub_quark') { explosionColor = 0xD0D0D0; soundToPlay = sounds.subQuarkPop; }
                            
                            SoundManager.play(soundToPlay);
                            createExplosion(enemy.sprite.x, enemy.sprite.y, explosionColor);
                            if (enemy.sprite && !enemy.sprite._destroyed) enemy.sprite.destroy(); 
                            enemies.splice(j, 1);
                            if (gameState === 'PLAYING' && !p.isDemoProjectile) { 
                                score += enemy.points;
                                updateScoreDisplay();
                                checkForExtraLife(); 
                                SoundManager.play('enemyDestroy');
                            }
                        }
                        break; 
                    }
                }
                if (p.sprite._destroyed) continue; 

                for (let k = humansAndProgs.length - 1; k >= 0; k--) {
                    const entity = humansAndProgs[k];
                    if (entity.type === 'prog' && entity.sprite && !entity.sprite._destroyed) {
                        if (isColliding(p.sprite, entity.sprite, 5)) {
                            if (p.sprite && !p.sprite._destroyed) p.sprite.destroy();
                            playerProjectiles.splice(i, 1);
                            createExplosion(entity.sprite.x, entity.sprite.y, 0xFF55FF); 
                            SoundManager.play('progDestroy');
                            if (entity.sprite && !entity.sprite._destroyed) entity.sprite.destroy();
                            humansAndProgs.splice(k, 1);
                            if (gameState === 'PLAYING' && !p.isDemoProjectile) {
                                score += entity.points; 
                                updateScoreDisplay();
                                checkForExtraLife(); 
                                SoundManager.play('progDestroy');
                            }
                            break; 
                        }
                    }
                }
            }
            
            // Enemy Projectile vs Player/DemoPlayer
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const p = enemyProjectiles[i];
                if (!p || !p.sprite || p.sprite._destroyed) continue;
                const invulnerable = gameState === 'PLAYING' ? playerInvulnerableTime > 0 : false; 
                if (!invulnerable && currentPlayer.sprite && !currentPlayer.sprite._destroyed && isColliding(p.sprite, currentPlayer.sprite, 5)) {
                    if (p.sprite && !p.sprite._destroyed) p.sprite.destroy();
                    enemyProjectiles.splice(i,1);
                    if (gameState === 'PLAYING') playerHit();
                    else if (gameState === 'DEMO_PLAY') { 
                        console.log("Demo player hit by enemy projectile!");
                        if (demoPlayer && demoPlayer.sprite && !demoPlayer.sprite._destroyed) demoPlayer.sprite.destroy();
                        demoPlayer = null; 
                    }
                    break; 
                }
            }
            
            // Enemy Projectile vs Human (Tank Shells)
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const p = enemyProjectiles[i];
                if (!p || !p.sprite || p.sprite._destroyed || p.type !== 'tank_shell') continue;
                for (let j = humansAndProgs.length - 1; j >=0; j--) { 
                    const humanEntity = humansAndProgs[j];
                    if (humanEntity.type === 'human' && humanEntity.sprite && !humanEntity.sprite._destroyed) { 
                        if (isColliding(p.sprite, humanEntity.sprite, 5)) {
                            if (p.sprite && !p.sprite._destroyed) p.sprite.destroy(); 
                            enemyProjectiles.splice(i,1);
                            createExplosion(humanEntity.sprite.x, humanEntity.sprite.y, 0xCCCCCC); 
                            SoundManager.play('humanDeathByEnemy');
                            if (humanEntity.sprite && !humanEntity.sprite._destroyed) humanEntity.sprite.destroy(); 
                            humansAndProgs.splice(j, 1);
                            if (gameState === 'PLAYING') {
                                currentHumanRescueBonus = INITIAL_HUMAN_RESCUE_BONUS; 
                                humanRescueBonusDecayTimer = 0; 
                                updateBonusDisplay();
                                SoundManager.play('humanDeathByEnemy');
                            }
                            break; 
                        }
                    }
                }
            }

            // Player/DemoPlayer vs Enemy
            const invulnerable = gameState === 'PLAYING' ? playerInvulnerableTime > 0 : false;
            if (!invulnerable) {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                     if (!enemy || !enemy.sprite || enemy.sprite._destroyed) continue;
                    if (currentPlayer.sprite && !currentPlayer.sprite._destroyed && isColliding(currentPlayer.sprite, enemy.sprite, 8)) {
                        if (gameState === 'PLAYING') playerHit();
                        else if (gameState === 'DEMO_PLAY') {
                             console.log("Demo player hit enemy!");
                             if (demoPlayer && demoPlayer.sprite && !demoPlayer.sprite._destroyed) demoPlayer.sprite.destroy();
                             demoPlayer = null;
                        }
                        break;
                    }
                }
                // Player/DemoPlayer vs Prog
                for (let i = humansAndProgs.length - 1; i >= 0; i--) {
                    const entity = humansAndProgs[i];
                    if (entity.type === 'prog' && entity.sprite && !entity.sprite._destroyed) {
                        if (currentPlayer.sprite && !currentPlayer.sprite._destroyed && isColliding(currentPlayer.sprite, entity.sprite, 8)) {
                           if (gameState === 'PLAYING') playerHit();
                           else if (gameState === 'DEMO_PLAY') {
                                console.log("Demo player hit prog!");
                                if (demoPlayer && demoPlayer.sprite && !demoPlayer.sprite._destroyed) demoPlayer.sprite.destroy();
                                demoPlayer = null;
                           }
                           break;
                        }
                    }
                }
            }
            
            // Player/DemoPlayer vs Obstacle (Electrodes)
            if (!invulnerable) {
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obstacle = obstacles[i];
                     if (!obstacle || !obstacle.sprite || obstacle.sprite._destroyed) continue;
                    if (currentPlayer.sprite && !currentPlayer.sprite._destroyed && isColliding(currentPlayer.sprite, obstacle.sprite, 6)) { 
                        if (gameState === 'PLAYING') playerHit();
                        else if (gameState === 'DEMO_PLAY') {
                             console.log("Demo player hit electrode!");
                             if (demoPlayer && demoPlayer.sprite && !demoPlayer.sprite._destroyed) demoPlayer.sprite.destroy();
                             demoPlayer = null;
                        }
                        break;
                    }
                }
            }

            // Enemy vs Human (Hulk killing human)
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (!enemy || !enemy.sprite || enemy.sprite._destroyed) continue;
                if (enemy.type === 'hulk') { 
                    for (let j = humansAndProgs.length - 1; j >= 0; j--) {
                        const humanEntity = humansAndProgs[j];
                        if (humanEntity.type === 'human' && humanEntity.sprite && !humanEntity.sprite._destroyed) { 
                            if (isColliding(enemy.sprite, humanEntity.sprite, 10)) { 
                                createExplosion(humanEntity.sprite.x, humanEntity.sprite.y, 0xCCCCCC); 
                                SoundManager.play('humanDeathByEnemy');
                                if (humanEntity.sprite && !humanEntity.sprite._destroyed) humanEntity.sprite.destroy(); 
                                humansAndProgs.splice(j, 1);
                                if (gameState === 'PLAYING') {
                                    currentHumanRescueBonus = INITIAL_HUMAN_RESCUE_BONUS; 
                                    humanRescueBonusDecayTimer = 0; 
                                }
                                break; 
                            }
                        }
                    }
                }
            }

            // Player/DemoPlayer vs Human (Rescue)
            for (let i = humansAndProgs.length - 1; i >= 0; i--) {
                const humanEntity = humansAndProgs[i];
                 if (humanEntity.type === 'human' && humanEntity.sprite && !humanEntity.sprite._destroyed) { 
                    if (currentPlayer.sprite && !currentPlayer.sprite._destroyed && isColliding(currentPlayer.sprite, humanEntity.sprite, 8)) {
                        if (humanEntity.sprite && !humanEntity.sprite._destroyed) humanEntity.sprite.destroy(); 
                        humansAndProgs.splice(i, 1);    
                        if (gameState === 'PLAYING') {
                            score += currentHumanRescueBonus; 
                            checkForExtraLife(); 
                            SoundManager.play('humanRescue');
                            if (currentHumanRescueBonus < MAX_HUMAN_RESCUE_BONUS) {
                                currentHumanRescueBonus += HUMAN_RESCUE_BONUS_INCREMENT;
                            }
                            humanRescueBonusDecayTimer = HUMAN_RESCUE_BONUS_DECAY_DURATION; 
                        } else if (gameState === 'DEMO_PLAY') {
                            console.log("Demo player rescued human!");
                        }
                    }
                }
            }
        }

        function playerHit() { 
            if (!player || !player.isAlive || playerInvulnerableTime > 0) return;
            createExplosion(player.sprite.x, player.sprite.y);
            SoundManager.play('playerDeath');
            lives--; 
            player.isAlive = false; 
            currentHumanRescueBonus = INITIAL_HUMAN_RESCUE_BONUS;
            humanRescueBonusDecayTimer = 0; 

            if (lives <= 0) { gameState = 'GAME_OVER'; showGameOverScreen(); }
            else {
                playerInvulnerableTime = RESPAWN_INVULNERABILITY_TIME; 
                if (player.sprite) player.sprite.visible = false;
                setTimeout(() => {
                    if (gameState === 'GAME_OVER') return;
                    if (player && player.sprite) {
                         player.sprite.x = GAME_WIDTH / 2; player.sprite.y = GAME_HEIGHT / 2;
                         player.sprite.visible = true; 
                    }
                    if(player) player.isAlive = true;
                }, 500);
            }
        }

        function isColliding(spriteA, spriteB, tolerance = 5) {
            if (!spriteA || !spriteB || spriteA._destroyed || spriteB._destroyed || !spriteA.visible || !spriteB.visible) return false;
            const a = spriteA.getBounds(); const b = spriteB.getBounds();
            return a.x < b.x + b.width - tolerance && a.x + a.width > b.x + tolerance &&
                   a.y < b.y + b.height - tolerance && a.y + a.height > b.y + tolerance;
        }
        
        function createExplosion(x, y, color = 0xFFFFFF) {
            // Create inner and outer explosion rings
            const numParticles = 16;
            const numRings = 2;
            
            for (let ring = 0; ring < numRings; ring++) {
                const ringRadius = ring === 0 ? 2 : 4;
                const ringSpeed = ring === 0 ? 3 : 2;
                const ringLife = ring === 0 ? 15 : 25;
                
                for (let i = 0; i < numParticles; i++) {
                    const particle = new PIXI.Graphics();
                    const size = ring === 0 ? Math.random() * 2 + 2 : Math.random() * 1.5 + 1;
                    
                    // Create a more complex particle shape
                    particle.beginFill(color);
                    if (ring === 0) {
                        // Inner ring: larger, diamond-shaped particles
                        particle.moveTo(0, -size);
                        particle.lineTo(size, 0);
                        particle.lineTo(0, size);
                        particle.lineTo(-size, 0);
                    } else {
                        // Outer ring: smaller, circular particles
                        particle.drawCircle(0, 0, size);
                    }
                    particle.endFill();
                    
                    // Position and velocity
                    particle.x = x; particle.y = y;
                    const angle = (i / numParticles) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                    const speed = ringSpeed + Math.random();
                    particle.vx = Math.cos(angle) * speed;
                    particle.vy = Math.sin(angle) * speed;
                    
                    // Additional properties for animation
                    particle.life = ringLife + Math.random() * 10;
                    particle.maxLife = particle.life;
                    particle.rotation = Math.random() * Math.PI * 2;
                    particle.rotationSpeed = (Math.random() - 0.5) * 0.2;
                    
                    effectsContainer.addChild(particle);
                }
            }
        }
        
        function updateEffects(delta) {
            for (let i = effectsContainer.children.length - 1; i >= 0; i--) {
                const particle = effectsContainer.children[i];
                if (particle.life !== undefined) {
                    // Update position with slight deceleration
                    particle.vx *= 0.98;
                    particle.vy *= 0.98;
                    particle.x += particle.vx * delta;
                    particle.y += particle.vy * delta;
                    
                    // Smooth fade out based on life percentage
                    const lifePercent = particle.life / particle.maxLife;
                    particle.alpha = Math.min(1, lifePercent * 2);
                    
                    // Rotate the particle
                    if (particle.rotationSpeed) {
                        particle.rotation += particle.rotationSpeed * delta;
                    }
                    
                    // Scale down slightly as it fades
                    particle.scale.set(0.8 + lifePercent * 0.2);
                    
                    particle.life -= delta;
                    if (particle.life <= 0) { effectsContainer.removeChildAt(i); particle.destroy(); }
                }
            }
        }

        // AI-controlled movement for demo mode
        let demoShootTimer = 0;
        let demoMovePhase = 0;
        let demoMoveTimer = 0;
        
        function updateDemoPlayerMovement() {
            if (!demoPlayer || !demoPlayer.isAlive) return;

            demoShootTimer++;
            demoMoveTimer++;

            // Every 4 seconds, change movement phase
            if (demoMoveTimer >= 240) {
                demoMoveTimer = 0;
                demoMovePhase = (demoMovePhase + 1) % 4;
            }

            // Demonstrate movement in different directions
            switch(demoMovePhase) {
                case 0: // Move right
                    demoPlayer.dx = demoPlayer.speed;
                    demoPlayer.dy = 0;
                    break;
                case 1: // Move down
                    demoPlayer.dx = 0;
                    demoPlayer.dy = demoPlayer.speed;
                    break;
                case 2: // Move left
                    demoPlayer.dx = -demoPlayer.speed;
                    demoPlayer.dy = 0;
                    break;
                case 3: // Move up
                    demoPlayer.dx = 0;
                    demoPlayer.dy = -demoPlayer.speed;
                    break;
            }

            // Demonstrate shooting in 8 directions every 60 frames
            if (demoShootTimer >= 60) {
                const shootAngles = [
                    0,      // right
                    Math.PI / 4,   // up-right
                    Math.PI / 2,   // up
                    3 * Math.PI / 4, // up-left
                    Math.PI,  // left
                    5 * Math.PI / 4, // down-left
                    3 * Math.PI / 2, // down
                    7 * Math.PI / 4  // down-right
                ];
                
                // Get current shooting direction (cycles through all 8 directions)
                const currentShootIndex = Math.floor(demoMoveTimer / 120) % 8;
                const shootAngle = shootAngles[currentShootIndex];
                
                // Create projectile with reduced speed
                createPlayerProjectile(
                    demoPlayer.sprite.x,
                    demoPlayer.sprite.y,
                    Math.cos(shootAngle) * (PROJECTILE_SPEED * 0.3),
                    Math.sin(shootAngle) * (PROJECTILE_SPEED * 0.3)
                );
                
                demoShootTimer = 0;
            }

            // Find nearest enemy for avoidance
            let nearestEnemy = null;
            let minEnemyDist = Infinity;

            enemies.forEach(enemy => {
                const dx = enemy.sprite.x - demoPlayer.sprite.x;
                const dy = enemy.sprite.y - demoPlayer.sprite.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minEnemyDist) {
                    minEnemyDist = dist;
                    nearestEnemy = enemy;
                }
            });

            // Avoid enemies if too close
            if (nearestEnemy && minEnemyDist < 50) {
                const dx = nearestEnemy.sprite.x - demoPlayer.sprite.x;
                const dy = nearestEnemy.sprite.y - demoPlayer.sprite.y;
                const angle = Math.atan2(dy, dx);
                demoPlayer.dx = -Math.cos(angle) * demoPlayer.speed;
                demoPlayer.dy = -Math.sin(angle) * demoPlayer.speed;
            }
            
            // Apply movement
            if (demoPlayer.dx || demoPlayer.dy) {
                demoPlayer.sprite.x += demoPlayer.dx;
                demoPlayer.sprite.y += demoPlayer.dy;
                
                // Keep player in bounds
                demoPlayer.sprite.x = Math.max(0, Math.min(GAME_WIDTH, demoPlayer.sprite.x));
                demoPlayer.sprite.y = Math.max(0, Math.min(GAME_HEIGHT, demoPlayer.sprite.y));
            }

            // Keep player in bounds
            if (demoPlayer.sprite.x < 10) demoPlayer.dx = Math.abs(demoPlayer.dx);
            if (demoPlayer.sprite.x > GAME_WIDTH - 10) demoPlayer.dx = -Math.abs(demoPlayer.dx);
            if (demoPlayer.sprite.y < 10) demoPlayer.dy = Math.abs(demoPlayer.dy);
            if (demoPlayer.sprite.y > GAME_HEIGHT - 10) demoPlayer.dy = -Math.abs(demoPlayer.dy);
        }

        function startNextWave() {
            wave++; console.log(`Starting Wave: ${wave}`); 
            SoundManager.play('waveStart');
