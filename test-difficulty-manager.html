<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DifficultyManager Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
        }
        .test-section {
            background: #252526;
            padding: 15px;
            margin: 10px 0;
            border-left: 3px solid #4ec9b0;
        }
        .success {
            color: #4ec9b0;
        }
        .error {
            color: #f48771;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            font-family: monospace;
        }
        button:hover {
            background: #1177bb;
        }
        pre {
            background: #1e1e1e;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🎮 DifficultyManager Test Suite</h1>

    <div class="test-section">
        <h2>Manual Tests</h2>
        <button onclick="testInitialization()">Test 1: Initialization</button>
        <button onclick="testDifficultyLevels()">Test 2: Difficulty Levels</button>
        <button onclick="testWaveScaling()">Test 3: Wave Scaling</button>
        <button onclick="testPerformanceTracking()">Test 4: Performance Tracking</button>
        <button onclick="testAdaptiveDifficulty()">Test 5: Adaptive Difficulty</button>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearOutput()">Clear Output</button>
    </div>

    <div class="test-section">
        <h2>Test Output</h2>
        <pre id="output"></pre>
    </div>

    <div class="test-section">
        <h2>Debug Console</h2>
        <button onclick="showCurrentState()">Show Current State</button>
        <button onclick="showMultipliers()">Show Multipliers</button>
        <button onclick="showPerformance()">Show Performance</button>
        <pre id="debug"></pre>
    </div>

    <script type="module">
        import { difficultyManager, DifficultyLevel } from './js/core/DifficultyManager.js';
        import { gameEvents } from './js/core/EventSystem.js';

        // Make available globally for button onclick handlers
        window.difficultyManager = difficultyManager;
        window.DifficultyLevel = DifficultyLevel;
        window.gameEvents = gameEvents;

        function log(message, isError = false) {
            const output = document.getElementById('output');
            const line = document.createElement('div');
            line.className = isError ? 'error' : 'success';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function logDebug(data) {
            const debug = document.getElementById('debug');
            debug.textContent = JSON.stringify(data, null, 2);
        }

        window.log = log;
        window.logDebug = logDebug;

        // Test functions
        window.testInitialization = function() {
            log('=== Test 1: Initialization ===');
            try {
                const level = difficultyManager.getCurrentLevel();
                const multipliers = difficultyManager.getCurrentMultipliers();

                if (level === DifficultyLevel.NORMAL &&
                    multipliers.enemySpawnRateMultiplier === 1.0) {
                    log('✅ Initialization: PASSED - Default level is NORMAL with 1.0x multipliers');
                } else {
                    log(`❌ Initialization: FAILED - Level: ${level}, Spawn: ${multipliers.enemySpawnRateMultiplier}`, true);
                }
                logDebug({ level, multipliers });
            } catch (error) {
                log(`❌ Initialization: ERROR - ${error.message}`, true);
            }
        };

        window.testDifficultyLevels = function() {
            log('=== Test 2: Difficulty Levels ===');
            try {
                // Test Easy
                difficultyManager.setDifficultyLevel(DifficultyLevel.EASY);
                const easy = difficultyManager.getCurrentMultipliers();
                log(`Easy: Spawn ${easy.enemySpawnRateMultiplier}x, Speed ${easy.enemySpeedMultiplier}x`);

                // Test Hard
                difficultyManager.setDifficultyLevel(DifficultyLevel.HARD);
                const hard = difficultyManager.getCurrentMultipliers();
                log(`Hard: Spawn ${hard.enemySpawnRateMultiplier}x, Speed ${hard.enemySpeedMultiplier}x`);

                // Test Nightmare
                difficultyManager.setDifficultyLevel(DifficultyLevel.NIGHTMARE);
                const nightmare = difficultyManager.getCurrentMultipliers();
                log(`Nightmare: Spawn ${nightmare.enemySpawnRateMultiplier}x, Speed ${nightmare.enemySpeedMultiplier}x`);

                if (easy.enemySpawnRateMultiplier < hard.enemySpawnRateMultiplier &&
                    hard.enemySpawnRateMultiplier < nightmare.enemySpawnRateMultiplier) {
                    log('✅ Difficulty Levels: PASSED - Difficulty scales correctly');
                } else {
                    log('❌ Difficulty Levels: FAILED - Scaling incorrect', true);
                }

                difficultyManager.setDifficultyLevel(DifficultyLevel.NORMAL);
            } catch (error) {
                log(`❌ Difficulty Levels: ERROR - ${error.message}`, true);
            }
        };

        window.testWaveScaling = function() {
            log('=== Test 3: Wave Scaling ===');
            try {
                difficultyManager.reset();

                // Wave 1
                gameEvents.emit({ type: 'wave:started', timestamp: Date.now(), source: 'test', data: { wave: 1 } });
                const wave1 = difficultyManager.getCurrentMultipliers();

                // Wave 10
                gameEvents.emit({ type: 'wave:started', timestamp: Date.now(), source: 'test', data: { wave: 10 } });
                const wave10 = difficultyManager.getCurrentMultipliers();

                log(`Wave 1: Spawn ${wave1.enemySpawnRateMultiplier.toFixed(2)}x`);
                log(`Wave 10: Spawn ${wave10.enemySpawnRateMultiplier.toFixed(2)}x`);

                if (wave10.enemySpawnRateMultiplier > wave1.enemySpawnRateMultiplier) {
                    log('✅ Wave Scaling: PASSED - Difficulty increases with waves');
                } else {
                    log('❌ Wave Scaling: FAILED - No scaling detected', true);
                }

                difficultyManager.reset();
            } catch (error) {
                log(`❌ Wave Scaling: ERROR - ${error.message}`, true);
            }
        };

        window.testPerformanceTracking = function() {
            log('=== Test 4: Performance Tracking ===');
            try {
                difficultyManager.reset();

                // Simulate kills
                for (let i = 0; i < 10; i++) {
                    gameEvents.emit({ type: 'enemy:destroyed', timestamp: Date.now(), source: 'test', data: {} });
                }

                // Simulate rescues
                for (let i = 0; i < 3; i++) {
                    gameEvents.emit({ type: 'human:rescued', timestamp: Date.now(), source: 'test', data: {} });
                }

                const metrics = difficultyManager.getPerformanceMetrics();
                log(`Enemies Killed: ${metrics.totalEnemiesKilled}`);
                log(`Humans Rescued: ${metrics.humansRescued}`);

                if (metrics.totalEnemiesKilled === 10 && metrics.humansRescued === 3) {
                    log('✅ Performance Tracking: PASSED - Metrics tracked correctly');
                } else {
                    log('❌ Performance Tracking: FAILED - Metrics incorrect', true);
                }

                difficultyManager.reset();
            } catch (error) {
                log(`❌ Performance Tracking: ERROR - ${error.message}`, true);
            }
        };

        window.testAdaptiveDifficulty = function() {
            log('=== Test 5: Adaptive Difficulty ===');
            try {
                difficultyManager.reset();
                difficultyManager.setDifficultyLevel(DifficultyLevel.ADAPTIVE);

                // Simulate poor performance
                for (let i = 0; i < 5; i++) {
                    gameEvents.emit({ type: 'player:died', timestamp: Date.now(), source: 'test', data: {} });
                }
                for (let i = 0; i < 2; i++) {
                    gameEvents.emit({ type: 'enemy:destroyed', timestamp: Date.now(), source: 'test', data: {} });
                }

                const performance = difficultyManager.getPerformanceScore();
                log(`Performance Score: ${(performance * 100).toFixed(1)}%`);

                if (performance < 0.5) {
                    log('✅ Adaptive Difficulty: PASSED - Recognizes poor performance');
                } else {
                    log('❌ Adaptive Difficulty: FAILED - Performance score too high', true);
                }

                difficultyManager.reset();
                difficultyManager.setDifficultyLevel(DifficultyLevel.NORMAL);
            } catch (error) {
                log(`❌ Adaptive Difficulty: ERROR - ${error.message}`, true);
            }
        };

        window.runAllTests = function() {
            clearOutput();
            log('🚀 Running All Tests...\n');
            setTimeout(() => testInitialization(), 100);
            setTimeout(() => testDifficultyLevels(), 500);
            setTimeout(() => testWaveScaling(), 1000);
            setTimeout(() => testPerformanceTracking(), 1500);
            setTimeout(() => testAdaptiveDifficulty(), 2000);
            setTimeout(() => log('\n✅ All tests complete!'), 2500);
        };

        window.clearOutput = function() {
            document.getElementById('output').innerHTML = '';
            document.getElementById('debug').innerHTML = '';
        };

        window.showCurrentState = function() {
            const debugInfo = difficultyManager.getDebugInfo();
            logDebug(debugInfo);
            log('Current state displayed in debug console');
        };

        window.showMultipliers = function() {
            const multipliers = difficultyManager.getCurrentMultipliers();
            logDebug(multipliers);
            log('Current multipliers displayed in debug console');
        };

        window.showPerformance = function() {
            const metrics = difficultyManager.getPerformanceMetrics();
            const score = difficultyManager.getPerformanceScore();
            logDebug({ score, metrics });
            log(`Performance score: ${(score * 100).toFixed(1)}%`);
        };

        // Auto-run on load
        log('DifficultyManager test page loaded');
        log('Click buttons above to run tests, or use "Run All Tests"');
        log('Debug interface available at: window.difficultyManager\n');
    </script>
</body>
</html>
