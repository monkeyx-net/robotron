            obstacles.forEach(o => { if (o.sprite && !o.sprite._destroyed) o.sprite.destroy(); }); obstacles.length = 0;
            
            // Reset player position to center
            if (player && player.sprite && !player.sprite._destroyed) {
                player.sprite.x = GAME_WIDTH / 2;
                player.sprite.y = GAME_HEIGHT / 2;
            }
            
            let numGrunts = 0; let numHulks = 0; let numSpheroids = 0; let numBrains = 0; let numTanks = 0; let numQuarks = 0;
            let numHumansToSpawn = 0; let numElectrodes = 0;

            if (wave === 1) {
                numGrunts = 20 + Math.floor(Math.random() * 11); 
                numHumansToSpawn = 5 + Math.floor(Math.random() * 6); 
                numElectrodes = 2 + Math.floor(Math.random() * 3); 
            } else if (wave >= 2 && wave <= 5) {
                numGrunts = 25 + wave * 3;
                numHulks = 1 + Math.floor((wave - 2) / 2); 
                numSpheroids = 1 + Math.floor((wave - 2) / 2); 
                numHumansToSpawn = Math.max(3, 7 - wave); 
                numElectrodes = 3 + wave -1;
            } else if (wave >= 6 && wave <= 10) {
                numGrunts = 30 + wave * 2;
                numHulks = 2 + Math.floor((wave - 6) / 3);
                numSpheroids = 2 + Math.floor((wave - 6) / 3);
                numBrains = 1 + Math.floor((wave - 6) / 2); 
                numTanks = 1 + Math.floor((wave - 6) / 3);  
                numHumansToSpawn = Math.max(2, 5 - Math.floor((wave-6)/2) );

                numGrunts = 30 + wave * 2;
                numHulks = 2 + Math.floor(wave/5);
                numSpheroids = 2 + Math.floor(wave/5);
                numBrains = 2 + Math.floor(wave/4);
                numTanks = 2 + Math.floor(wave/4);
                numQuarks = 1 + Math.floor((wave-10)/3); 
                numHumansToSpawn = Math.max(1, 4 - Math.floor(wave/5));
                numElectrodes = Math.min(10, 5 + Math.floor(wave/3));

        function gameLoop(delta) {
            // Always check for gamepad input first
            if (gamepadConnected) {
                const gamepads = navigator.getGamepads();
                if (gamepads) {
                    for (const gamepad of gamepads) {
                        if (gamepad) handleGamepadState(gamepad);
                    }
                }
            }

            if (gameState === 'TITLE_SCREEN' || gameState === 'HIGH_SCORE_DISPLAY_SCREEN') {
                updateAttractMode(delta);
                return;
            }

            if (gameState === 'DEMO_PLAY') {
                updateAttractMode(delta);
                if (demoPlayer) updatePlayer(delta, demoPlayer);
                updatePlayerProjectiles(delta);
                updateEnemyProjectiles(delta);
                updateEnemies(delta);
                updateObstacles(delta);
                updateHumansAndProgs(delta);
                updateEffects(delta);
                checkCollisions();
                return;
            }

            if (gameState === 'GAME_OVER') {
                return;
            }

            handleInput();
            updatePlayer(delta);
            updatePlayerProjectiles(delta);
            updateEnemyProjectiles(delta);
            updateEnemies(delta);
            updateObstacles(delta);
            updateHumansAndProgs(delta);
            updateBonusDecay(delta);
            updateEffects(delta);
            checkCollisions();
            updateUI();
            checkWaveCompletion();
        }

        function resizeGame() {
            const screenWidth = window.innerWidth; const screenHeight = window.innerHeight;
            const gameWrapper = document.getElementById('game-wrapper'); 
            const uiContainer = document.getElementById('ui-container'); const msgBox = document.getElementById('message-box');
            // const startButton = document.getElementById('start-button'); // This was for the HTML message box start, not needed for title screen
            const titleElement = document.getElementById('message-title'); 
            
            const baseUiHeight = uiContainer.offsetHeight || 30; 
            
            const scaleX = screenWidth / GAME_WIDTH;
            const availableHeightForCanvas = Math.max(1, screenHeight - baseUiHeight - 20);
