<!DOCTYPE html>
<html>
<head>
    <title>State System Test</title>
</head>
<body>
    <h1>State System Test</h1>
    <p>Open the browser console and run: <code>window.testStateSystem()</code></p>
    <p>Or check: <code>window.gameStateDebug.getCurrentState()</code></p>
    
    <script>
        // Simple test to verify the state system is accessible
        setTimeout(() => {
            if (window.gameStateDebug) {
                console.log('✅ State system is available');
                console.log('Current state:', window.gameStateDebug.getCurrentState());
                console.log('Debug info:', window.gameStateDebug.getDebugInfo());
            } else {
                console.log('❌ State system not available yet, try again in a few seconds');
            }
        }, 2000);
    </script>
</body>
</html>
